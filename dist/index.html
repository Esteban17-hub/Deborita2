<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deborita Gestión Local - Administración Financiera Congregacional</title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <script type="module" crossorigin src="/assets/index-y5u_4hSt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CA9wYlHL.css">
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-white font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(err => {
            console.log('SW registration failed:', err);
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }

      // Watchdog de Autoreparación: Elimina pantallas en blanco automáticamente
      setTimeout(() => {
        const rootEl = document.getElementById('root');
        if (rootEl && rootEl.children.length === 0) {
          console.warn('Pantalla en blanco detectada. Autorreparando app...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
              for (let reg of registrations) reg.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(names => {
              for (let name of names) caches.delete(name);
            });
          }
          setTimeout(() => window.location.reload(true), 500);
        }
      }, 2500);
    </script>
  </body>
</html>
